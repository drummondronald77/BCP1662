12"}, "06-29": {"first": "Sirach 19", "second": "Acts 4"}, "07-25": {"first": "Sirach 22", "second": "—"}, "08-24": {"first": "Sirach 29", "second": "—"}, "09-21": {"first": "Sirach 38", "second": "—"}, "09-29": {"first": "Daniel 10:5–21", "second": "Jude 6–15"}, "10-18": {"first": "Job 1", "second": "—"}, "10-28": {"first": "Job 42", "second": "—"}, "11-01": {"first": "Wisdom 5:1–16", "second": "Revelation 19:1–16"}, "11-30": {"first": "Proverbs 21", "second": "—"}, "12-21": {"first": "Proverbs 24", "second": "—"}, "12-25": {"first": "Isaiah 7:10–16", "second": "Titus 3:4–8"}, "12-26": {"first": "Ecclesiastes 4", "second": "Acts 7:30–54"}, "12-27": {"first": "Ecclesiastes 6", "second": "Revelation 22"}, "12-28": {"first": "Wisdom 1", "second": "—"}}, "feasts": {"01-01": "The Circumcision of our Lord", "01-06": "The Epiphany", "01-25": "The Conversion of St Paul", "02-02": "The Purification of the Blessed Virgin Mary", "02-24": "St Matthias", "03-25": "The Annunciation", "04-25": "St Mark", "05-01": "St Philip and St James", "06-11": "St Barnabas", "06-24": "The Nativity of St John Baptist", "06-29": "St Peter", "07-25": "St James", "08-24": "St Bartholomew", "09-21": "St Matthew", "09-29": "St Michael and All Angels", "10-18": "St Luke", "10-28": "St Simon and St Jude", "11-01": "All Saints' Day", "11-30": "St Andrew", "12-21": "St Thomas", "12-25": "The Nativity of our Lord", "12-26": "St Stephen", "12-27": "St John", "12-28": "The Holy Innocents"}, "psalms": [], "office": {"EXHORTATION": "DEARLY beloved brethren, the Scripture moveth us in sundry places to acknowledge and confess our manifold sins and wickedness; and that we should not dissemble nor cloak them before the face of Almighty God our heavenly Father; but confess them with an humble, lowly, penitent, and obedient heart; to the end that we may obtain forgiveness of the same, by his infinite goodness and mercy.", "CONFESSION": "ALMIGHTY and most merciful Father; We have erred, and strayed from thy ways like lost sheep. We have followed too much the devices and desires of our own hearts. We have offended against thy holy laws. We have left undone those things which we ought to have done; And we have done those things which we ought not to have done; And there is no health in us. But thou, O Lord, have mercy upon us, miserable offenders. Spare thou them, O God, which confess their faults. Restore thou them that are penitent; According to thy promises declared unto mankind in Christ Jesu our Lord. And grant, O most merciful Father, for his sake; That we may hereafter live a godly, righteous, and sober life, To the glory of thy holy Name. Amen.", "ABSOLUTION": "ALMIGHTY God, the Father of our Lord Jesus Christ, who desireth not the death of a sinner, but rather that he may turn from his wickedness, and live; and hath given power, and commandment, to his Ministers, to declare and pronounce to his people, being penitent, the Absolution and Remission of their sins: He pardoneth and absolveth all them that truly repent, and unfeignedly believe his holy Gospel. Wherefore let us beseech him to grant us true repentance, and his Holy Spirit; that those things may please him, which we do at this present; and that the rest of our life hereafter may be pure, and holy; so that at the last we may come to his eternal joy; through Jesus Christ our Lord. Amen.", "LORDS_PRAYER": "OUR Father, which art in heaven, Hallowed be thy Name. Thy kingdom come. Thy will be done in earth, As it is in heaven. Give us this day our daily bread. And forgive us our trespasses, As we forgive them that trespass against us. And lead us not into temptation; But deliver us from evil. For thine is the kingdom, The power, and the glory, For ever and ever. Amen.", "PRECES": "O Lord, open thou our lips.\nAnd our mouth shall shew forth thy praise.\n\nO God, make speed to save us.\nO Lord, make haste to help us.\n\nGlory be to the Father, and to the Son, and to the Holy Ghost;\nAs it was in the beginning, is now, and ever shall be, world without end. Amen.\n\nPraise ye the Lord.\nThe Lord's Name be praised.", "VENITE": "O COME, let us sing unto the Lord: let us heartily rejoice in the strength of our salvation. Let us come before his presence with thanksgiving: and shew ourselves glad in him with psalms. For the Lord is a great God: and a great King above all gods. In his hand are all the corners of the earth: and the strength of the hills is his also. The sea is his, and he made it: and his hands prepared the dry land. O come, let us worship, and fall down: and kneel before the Lord our Maker. For he is the Lord our God: and we are the people of his pasture, and the sheep of his hand.", "TE_DEUM": "WE praise thee, O God: we acknowledge thee to be the Lord. All the earth doth worship thee: the Father everlasting. To thee all Angels cry aloud: the Heavens, and all the Powers therein. To thee Cherubin, and Seraphin: continually do cry, Holy, Holy, Holy: Lord God of Sabaoth; Heaven and earth are full of the Majesty: of thy glory.", "BENEDICTUS": "BLESSED be the Lord God of Israel: for he hath visited, and redeemed his people; And hath raised up a mighty salvation for us: in the house of his servant David; As he spake by the mouth of his holy Prophets: which have been since the world began.", "MAGNIFICAT": "MY soul doth magnify the Lord: and my spirit hath rejoiced in God my Saviour. For he hath regarded: the lowliness of his hand-maiden. For behold, from henceforth: all generations shall call me blessed. For he that is mighty hath magnified me: and holy is his Name.", "NUNC_DIMITTIS": "LORD, now lettest thou thy servant depart in peace: according to thy word. For mine eyes have seen: thy salvation, Which thou hast prepared: before the face of all people; To be a light to lighten the Gentiles: and to be the glory of thy people Israel.", "CREED": "I BELIEVE in God the Father Almighty, Maker of heaven and earth: And in Jesus Christ his only Son our Lord, Who was conceived by the Holy Ghost, Born of the Virgin Mary, Suffered under Pontius Pilate, Was crucified, dead, and buried: He descended into hell; The third day he rose again from the dead; He ascended into heaven, And sitteth on the right hand of God the Father Almighty; From thence he shall come to judge the quick and the dead. I believe in the Holy Ghost; The holy Catholick Church; The Communion of Saints; The Forgiveness of sins; The Resurrection of the body, And the life everlasting. Amen.", "SUFFRAGES": "The Lord be with you.\nAnd with thy spirit.\nLet us pray.\n\nO Lord, shew thy mercy upon us;\nAnd grant us thy salvation.\n\nO Lord, save the King;\nAnd mercifully hear us when we call upon thee.\n\nEndue thy Ministers with righteousness;\nAnd make thy chosen people joyful.\n\nO Lord, save thy people;\nAnd bless thine inheritance.\n\nGive peace in our time, O Lord;\nBecause there is none other that fighteth for us, but only thou, O God.\n\nO God, make clean our hearts within us;\nAnd take not thy Holy Spirit from us.", "MORNING_PEACE": "O GOD, who art the author of peace and lover of concord, in knowledge of whom standeth our eternal life, whose service is perfect freedom; Defend us thy humble servants in all assaults of our enemies; that we, surely trusting in thy defence, may not fear the power of any adversaries, through the might of Jesus Christ our Lord. Amen.", "MORNING_GRACE": "O LORD, our heavenly Father, Almighty and everlasting God, who hast safely brought us to the beginning of this day; Defend us in the same with thy mighty power; and grant that this day we fall into no sin, neither run into any kind of danger; but that all our doings may be ordered by thy governance, to do always that is righteous in thy sight; through Jesus Christ our Lord. Amen.", "EVENING_PEACE": "O GOD, from whom all holy desires, all good counsels, and all just works do proceed; Give unto thy servants that peace which the world cannot give; that both our hearts may be set to obey thy commandments, and also that by thee we being defended from the fear of our enemies may pass our time in rest and quietness; through the merits of Jesus Christ our Saviour. Amen.", "EVENING_PERILS": "LIGHTEN our darkness, we beseech thee, O Lord; and by thy great mercy defend us from all perils and dangers of this night; for the love of thy only Son, our Saviour, Jesus Christ. Amen.", "PRAYER_FOR_KING": "O LORD our heavenly Father, high and mighty, King of kings, Lord of lords, the only Ruler of princes, who dost from thy throne behold all the dwellers upon earth; Most heartily we beseech thee with thy favour to behold our most gracious Sovereign Lord, King CHARLES; and so replenish him with the grace of thy Holy Spirit, that he may alway incline to thy will, and walk in thy way.", "PRAYER_FOR_ROYAL_FAMILY": "ALMIGHTY God, the fountain of all goodness, we humbly beseech thee to bless our gracious Queen CAMILLA, William Prince of Wales, the Princess of Wales, and all the Royal Family: Endue them with thy Holy Spirit; enrich them with thy heavenly grace; prosper them with all happiness; and bring them to thine everlasting kingdom; through Jesus Christ our Lord. Amen.", "PRAYER_FOR_CLERGY": "ALMIGHTY and everlasting God, who alone workest great marvels; Send down upon our Bishops, and Curates, and all Congregations committed to their charge, the healthful Spirit of thy grace; and that they may truly please thee, pour upon them the continual dew of thy blessing. Grant this, O Lord, for the honour of our Advocate and Mediator, Jesus Christ. Amen.", "CHRYSOSTOM": "ALMIGHTY God, who hast given us grace at this time with one accord to make our common supplications unto thee; and dost promise, that when two or three are gathered together in thy Name thou wilt grant their requests; Fulfil now, O Lord, the desires and petitions of thy servants, as may be most expedient for them; granting us in this world knowledge of thy truth, and in the world to come life everlasting. Amen.", "GRACE": "THE grace of our Lord Jesus Christ, and the love of God, and the fellowship of the Holy Ghost, be with us all evermore. Amen."}, "litany": "The Litany text is included in the Android source package."};</script><script>const D=window.BCP_DATA; let view='today'; let date=new Date(); let deferredPrompt=null; const $=s=>document.querySelector(s); const esc=s=>(s||'—').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}; function key(d){return String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function lesson(morning){let k=key(date), fixed=(morning?D.fixedMorning:D.fixedEvening)[k]; if(fixed)return {...fixed,feast:D.feasts[k]}; let tab=(morning?D.mattins:D.evensong)[String(date.getMonth()+1)]||[]; return {...(tab[date.getDate()-1]||{first:'—',second:'—'}),feast:D.feasts[k]};}
function ps(){return D.psalms[Math.min(date.getDate(),30)-1]||{morning:'—',evening:'—'}};
function easter(y){let a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),day=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,day)}
function add(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x} function same(a,b){return iso(a)===iso(b)}
function season(){let k0=key(date), feast=D.feasts[k0]; if(feast)return feast; let e=easter(date.getFullYear()); let special=[[0,'Easter Day'],[-2,'Good Friday'],[-7,'Palm Sunday'],[-46,'Ash Wednesday'],[39,'Ascension Day'],[49,'Whitsunday'],[56,'Trinity Sunday']]; for(let [n,t] of special)if(same(date,add(e,n)))return t; let nov30=new Date(date.getFullYear(),10,30), adv=new Date(nov30); adv.setDate(nov30.getDate()-nov30.getDay()); if(date>=adv&&date<new Date(date.getFullYear(),11,25))return 'Advent'; if(date>=new Date(date.getFullYear(),11,25)||date<new Date(date.getFullYear(),0,6))return 'Christmastide'; if(date<e&&date>add(e,-46))return 'Lent'; if(date>e&&date<add(e,49))return 'Eastertide'; return 'Ordinary Day in the Church Year'}
function top(){return `<div class="datebar"><input id="date" type="date" value="${iso(date)}"><button class="secondary" onclick="date=new Date();render()">Today</button></div><h1>${date.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</h1><div class="subtitle">${esc(season())}</div>`}
function card(title,p,l,v){return `<div class="card"><h2>${title}</h2>${l.feast?`<b>${esc(l.feast)}</b>`:''}<p>Psalms: ${esc(p)}<br>First Lesson: ${esc(l.first)}<br>Second Lesson: ${esc(l.second)}</p><button class="primary" onclick="view='${v}';render()">Pray the Office</button></div>`}
function today(){let p=ps(),m=lesson(true),e=lesson(false);return top()+`<div class="cardgrid">${card('Morning Prayer (Mattins)',p.morning,m,'morning')}${card('Evening Prayer (Evensong)',p.evening,e,'evening')}</div><div class="settings"><button class="secondary" onclick="changeFont(-1)">A−</button><button class="secondary" onclick="changeFont(1)">A+</button><button class="secondary" onclick="view='litany';render()">The Litany</button></div><div class="notice">This web edition works as an installable PWA. Once hosted over HTTPS, use your browser’s “Add to Home screen” command; after the first visit the app shell and lectionary remain available offline.</div>`}
const O=D.office; function sec(t,b,r=false){return `<section class="section"><h2>${esc(t)}</h2>${r?'<div class="rubric">According to the 1662 Book of Common Prayer</div>':''}<p>${esc(b||'')}</p></section>`}
function office(morning){let l=lesson(morning),p=ps(),ap=morning?p.morning:p.evening; let parts=[sec(morning?'The Order for Morning Prayer':'The Order for Evening Prayer',date.toLocaleDateString(),true),sec('Opening Sentences',morning?'At Morning Prayer, the Minister shall read with a loud voice some one or more of these sentences of the Scriptures.':'At Evening Prayer, the Minister shall read with a loud voice some one or more of these sentences of the Scriptures.'),sec('Exhortation',O.EXHORTATION),sec('General Confession',O.CONFESSION),sec('Absolution',O.ABSOLUTION),sec('The Lord’s Prayer',O.LORDS_PRAYER),sec('Preces',O.PRECES)]; if(morning)parts.push(sec('Venite, exultemus Domino — Psalm 95',O.VENITE)); parts.push(sec('The Psalms appointed — '+ap,'Use the Coverdale Psalter for Psalms '+ap+'.')); parts.push(sec('The First Lesson — '+l.first,'The appointed lesson is '+l.first+'.')); parts.push(sec(morning?'Te Deum laudamus':'Magnificat',morning?O.TE_DEUM:O.MAGNIFICAT)); parts.push(sec('The Second Lesson — '+l.second,'The appointed lesson is '+l.second+'.')); parts.push(sec(morning?'Benedictus':'Nunc dimittis',morning?O.BENEDICTUS:O.NUNC_DIMITTIS)); parts.push(sec('The Apostles’ Creed',O.CREED),sec('Suffrages',O.SUFFRAGES),sec('The Collect for Peace',morning?O.MORNING_PEACE:O.EVENING_PEACE),sec(morning?'The Collect for Grace':'The Collect for Aid against all Perils',morning?O.MORNING_GRACE:O.EVENING_PERILS),sec('A Prayer for the King’s Majesty',O.PRAYER_FOR_KING),sec('A Prayer for the Royal Family',O.PRAYER_FOR_ROYAL_FAMILY),sec('A Prayer for the Clergy and People',O.PRAYER_FOR_CLERGY),sec('A Prayer of St. Chrysostom',O.CHRYSOSTOM),sec('The Grace',O.GRACE)); return top()+parts.join('')}
function render(){let app=$('#app');app.innerHTML=view==='today'?today():view==='morning'?office(true):view==='evening'?office(false):top()+sec('The Litany',D.litany,true); let inp=$('#date');if(inp)inp.onchange=e=>{let [y,m,d]=e.target.value.split('-').map(Number);date=new Date(y,m-1,d);render()}; document.documentElement.style.setProperty('--font',(localStorage.fontSize||18)+'px');window.scrollTo(0,0)}
function changeFont(n){localStorage.fontSize=Math.max(15,Math.min(25,+(localStorage.fontSize||18)+n));render()} document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()}); $('#theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.dark=document.body.classList.contains('dark')?'1':'0'}; if(localStorage.dark==='1')document.body.classList.add('dark'); window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('#install').hidden=false}); $('#install').onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('#install').hidden=true}};  render();</script></body></html>
